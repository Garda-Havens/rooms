      display:grid;

/* ═══════════════════════════════════════════════════════════════════════
   0. ACCESS GATE (Secure Version with Apps Script)
═══════════════════════════════════════════════════════════════════════ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2cdYm7MnlzAredFUU0eiWS-ET0QEXVt7h1qbBnz-rybssxs6r1vamgiPZ-zjz4ywb/exec";

if (localStorage.getItem("ghAccess") === "granted") {
  document.getElementById("accessOverlay").style.display = "none";
}

let accessBusy = false;
/** silent = verifica automatica: in caso di codice sbagliato non mostra nessun avviso */
async function checkAccess(silent) {
  silent = silent === true;
  if (accessBusy) return;
  const val = document.getElementById("accessCode").value.trim();

  if (!val) {
    if (!silent) alert("Inserisci il codice di accesso.");
    return;
  }

  const url = `${SCRIPT_URL}?key=${encodeURIComponent(val)}`;

  accessBusy = true;
  try {
    const response = await fetch(url);
    const data = await response.json();

    if (data.success) {
      localStorage.setItem("ghAccess", "granted");
      localStorage.setItem("ghKey", val); // serve per scaricare le richieste dal sito (#r=...)
      setTimeout(fillFromHash, 0);
      document.getElementById("accessOverlay").style.display = "none";
    } else if (!silent) {
      alert("Codice errato ❌");
    }
  } catch (error) {
    console.error("Errore:", error);
    if (!silent) alert("Errore di connessione al server.");
  } finally {
    accessBusy = false;
  }
}

document.getElementById("accessForm")
  .addEventListener("submit", e => { e.preventDefault(); checkAccess(false); });

// Face ID / portachiavi: appena il codice smette di cambiare lo verifica da solo, senza avvisi.
// Funziona comunque Safari inserisca la password (con o senza eventi, con o senza "tasti").
// Se il codice è giusto entra; se è sbagliato o incompleto non succede niente.
(function () {
  const inp = document.getElementById("accessCode");
  const overlay = document.getElementById("accessOverlay");
  const MIN_LEN = 4;      // sotto i 4 caratteri non prova
  const PAUSE_MS = 700;   // attesa dopo l'ultimo cambiamento
  let last = "", tried = "", timer = null;
  const schedule = () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const v = inp.value.trim();
      if (overlay.style.display === "none" || v.length < MIN_LEN || v === tried) return;
      tried = v;                       // ogni codice viene provato una sola volta
      checkAccess(true);
    }, PAUSE_MS);
  };
  inp.addEventListener("input", schedule);
  inp.addEventListener("change", schedule);
  // Safari a volte riempie il campo senza nessun evento: controllo il valore 4 volte al secondo
  const poll = setInterval(() => {
    if (overlay.style.display === "none") { clearInterval(poll); return; }
    if (inp.value !== last) { last = inp.value; schedule(); }
  }, 250);
})();

/**

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHbv_XBgYojwiDWkjAFl3XRGj_19hQMmfweCcmFG7n9Fj3J3J17HUdxe7MvkdTjDex/exec";

/**
 * Chiama il backend Apps Script per creare l'evento sul calendario della camera.
 * @param {HTMLElement} btn   - Il bottone cliccato (per feedback visivo)
 * @param {number}  roomId
 * @param {string}  guestName
 * @param {string}  phone
 * @param {string}  checkin   - YYYY-MM-DD
 * @param {string}  checkout  - YYYY-MM-DD
 * @param {string}  description - prezzi concordati (va nella descrizione dell'evento)
 */
async function createCalendarEvent(btn, roomId, guestName, phone, checkin, checkout, description) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === "INCOLLA_QUI_URL_APPS_SCRIPT") {
    alert("⚙️ Configura prima APPS_SCRIPT_URL nel codice HTML.");
    return;
  }

  const namePart  = guestName || "Ospite";
  const phonePart = phone ? ` ${phone}` : "";
  const title     = `${namePart}${phonePart}`;

  // Feedback visivo
  const original = btn.innerHTML;
  btn.innerHTML   = "⏳ Salvo…";
  btn.style.opacity = "0.7";
  btn.style.pointerEvents = "none";

  // Codice d'accesso: lo script del calendario accetta solo richieste con il codice del generatore
  const send = async () => {
    let k = localStorage.getItem("ghKey");
    if (!k) {
      k = (prompt("Inserisci il codice d'accesso per salvare sul calendario") || "").trim();
      if (!k) return { ok: false, error: "auth" };
      localStorage.setItem("ghKey", k);
    }
    const res = await fetch(APPS_SCRIPT_URL, {
      method:  "POST",
      headers: { "Content-Type": "text/plain" }, // Apps Script richiede text/plain per evitare preflight CORS
      body:    JSON.stringify({ k, roomId, title, checkin, checkout, description }),
    });
    return res.json();
  };

  try {
    let json = await send();
    if (json.error === "auth") { localStorage.removeItem("ghKey"); json = await send(); } // codice vecchio: lo richiede una volta

    if (json.ok) {
      btn.innerHTML     = "✅ Salvato";
      btn.style.background = "#0a7a2f";
      btn.style.borderColor = "#0a7a2f";
    } else {
      btn.innerHTML = "❌ Errore";
      btn.style.background = "#c0392b";
      btn.style.borderColor = "#c0392b";
      console.error("Apps Script error:", json.error);
      const msg = { auth: "codice d'accesso errato", locked: "troppi tentativi con codice sbagliato, riprova tra un'ora",
        not_configured: "nello script del calendario manca la proprietà GENERATOR_KEY" };
      if (msg[json.error]) alert("Calendario: " + msg[json.error]);
    }
  } catch (err) {
    btn.innerHTML = "❌ Rete";
    btn.style.background = "#c0392b";
    btn.style.borderColor = "#c0392b";
    console.error("Fetch error:", err);
  } finally {
    btn.style.opacity = "1";
    // Ripristina dopo 3 secondi
    setTimeout(() => {
      btn.innerHTML = original;
      btn.style.background = "#4285F4";
      btn.style.borderColor = "#4285F4";
      btn.style.pointerEvents = "auto";
    }, 3000);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   2. HELPERS
═══════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);

/** Returns time-based greeting in Rome timezone */
function greeting(lang) {
  const hour = new Date().toLocaleString("en-US", { timeZone: "Europe/Rome", hour: "numeric", hour12: false }) | 0;
  if (lang === "en") {
    return hour < 12 ? "Good morning," : hour < 18 ? "Good afternoon," : "Good evening,";
  }
  return hour < 12 ? "Buongiorno," : hour < 18 ? "Buon pomeriggio," : "Buonasera,";
}

function formatEuro(n) {
  const v = Math.round(Number(n) * 100) / 100;
  return "€" + v.toLocaleString("it-IT", {
    minimumFractionDigits: v % 1 ? 2 : 0,
    maximumFractionDigits: 2
  });
}

function formatDateIT(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return `${String(d).padStart(2,"0")}/${String(m).padStart(2,"0")}/${y}`;
}
// EN date format: same dd/mm/yyyy for this property style
const formatDateEN = formatDateIT;

function isoToDate(iso) { return new Date(iso + "T00:00:00"); }

function nightsBetween(ci, co) {
  if (!ci || !co) return 0;
  return Math.max(0, Math.round((isoToDate(co) - isoToDate(ci)) / 86400000));
}

function pluralIT(n) { return n === 1 ? "notte" : "notti"; }
function pluralEN(n) { return n === 1 ? "night" : "nights"; }

function allSame(arr) { return arr.length === 0 || arr.every(x => x === arr[0]); }

function priceForRoom(roomId, guests) {
  const room = ROOMS.find(r => r.id === roomId);
  return room ? (room.prices[guests] ?? null) : null;
}

/** Richiesta caricata (#r= o riga GH): contatti, rif. e data di invio */
var currentRequest = null;

/** Preventivo di una camera dal listino unico (prezzo notte per notte + promo).
 *  Ritorna { error:"guests"|"contact" } oppure { nightly:[€...], full, promos:[{it,en,amount}] } */
function roomQuote(rid, guests, checkin, checkout) {
  const n = nightsBetween(checkin, checkout);
  if (!window.GHPrices) {               // listino non caricato: prezzi fissi di riserva
    const p = priceForRoom(rid, guests);
    return p === null ? { error: "guests" } : { nightly: Array(n).fill(p), full: p * n, promos: [] };
  }
  // Promo: valgono nel giorno in cui l'ospite ha mandato la richiesta (se la conosciamo), altrimenti oggi
  const bookedOn = currentRequest && /^\d{4}-\d{2}-\d{2}$/.test(currentRequest.sent || "") ? currentRequest.sent : undefined;
  const q = GHPrices.quote({ roomId: rid, guests, checkin, checkout, bookedOn });
  if (q.error) return q;
  return { nightly: q.nights.map(x => x.price), full: q.subtotal,
           promos: q.discounts.filter(x => x.kind === "promo") };
}

/** "€70 a notte"  oppure  "2 notti a €70 + 1 notte a €90" */
function nightlyLabel(nightly, lang) {
  const it = lang === "it";
  const groups = [];
  nightly.forEach(p => {
    const g = groups.find(x => x.p === p);
    g ? g.n++ : groups.push({ p, n: 1 });
  });
  if (groups.length === 1) return it ? `${formatEuro(groups[0].p)} a notte` : `${formatEuro(groups[0].p)} per night`;
  return groups.map(g => it ? `${g.n} ${pluralIT(g.n)} a ${formatEuro(g.p)}` : `${g.n} ${pluralEN(g.n)} at ${formatEuro(g.p)}`).join(" + ");
}

/** Righe promo (sommate su tutte le camere) */
function promoLines(roomData, lang) {
  const sum = {};
  roomData.forEach(r => (r.promos || []).forEach(p => {
    const k = lang === "it" ? p.it : p.en;
    sum[k] = (sum[k] || 0) + p.amount;
  }));
  return Object.keys(sum).map(k => `${k}: -${formatEuro(sum[k])}`);
}

/** Descrizione dell'evento calendario: prezzi concordati per una camera.
 *  r: { rid, g, nightly, full, promos }, manualPerNight: sconti manuali €/notte */
function calendarDescription(r, { guests, nights, checkin, checkout, manualPerNight, manualLines }) {
  if (r.missing) return "Prezzo: da definire";
  const promos = r.promos || [];
  const promoTot = promos.reduce((s, p) => s + p.amount, 0);
  const manual = manualPerNight * nights;
  const total = r.full - manual - promoTot;
  const g = guests === 1 ? "1 ospite" : `${guests} ospiti`;
  const out = [
    `Camera ${r.rid} · ${g} · ${formatDateIT(checkin)}–${formatDateIT(checkout)} (${nights} ${pluralIT(nights)})`,
    `Prezzo: ${nightlyLabel(r.nightly, "it")} = ${formatEuro(r.full)}`,
    ...(manual > 0 ? manualLines.map(l => `${l} → -${formatEuro(manual)}`) : []),
    ...promos.map(p => `${p.it} (${p.pct}%): -${formatEuro(p.amount)}`),
    `TOTALE CONCORDATO: ${formatEuro(total)}` + (total !== r.full ? ` (invece di ${formatEuro(r.full)})` : ""),
  ];
  const req = currentRequest;
  if (req && (req.ref || req.email || req.sent)) out.push([req.ref ? `Rif. ${req.ref}` : "", req.sent ? `richiesta del ${formatDateIT(req.sent)}` : "", req.email || ""].filter(Boolean).join(" · "));
  out.push(`Offerta creata il ${formatDateIT(new Date().toISOString().slice(0,10))}`);
  return out.join("\n");
}

function getSelectedRooms() {
  return [...document.querySelectorAll('input[name="roomCheck"]:checked')]
    .map(c => Number(c.value));
}

function isMultiMode() { return $("multiBooking").checked; }

/** Returns per-room guest counts in multi mode; falls back to single value. */
function getRoomGuests(rooms) {
  if (!isMultiMode()) {
    const g = Number($("guests").value);
    return rooms.map(() => g);
  }
  return rooms.map(rid => {
    const el = $(`mgRoom_${rid}`);
    return el ? Number(el.value) : 1;
  });
}

function getGuestName() {
  return isMultiMode()
    ? $("guestNameMulti").value.trim()
    : $("guestName").value.trim();
}


/* ═══════════════════════════════════════════════════════════════════════
   3. DATE UTILS
═══════════════════════════════════════════════════════════════════════ */
function formatISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function setDefaultDates() {
  const today = new Date();
  const daysUntilSat = (6 - today.getDay() + 7) % 7 || 7;
  const sat = new Date(today); sat.setDate(today.getDate() + daysUntilSat);
  const sun = new Date(sat);  sun.setDate(sat.getDate() + 1);
  $("checkin").value  = formatISO(sat);
  $("checkout").value = formatISO(sun);
}

function autoSetCheckoutFromCheckin() {
  const ci = $("checkin").value;
  if (!ci) return;
  const d = new Date(ci + "T00:00:00"); d.setDate(d.getDate() + 1);
  $("checkout").value = formatISO(d);
}

function autoSetDiscount() {
  const n = nightsBetween($("checkin").value, $("checkout").value);
  // Sconto più notti dal listino (static/js/prices.js); se è spento resta 0
  const ls = window.GHPrices && GHPrices.data.longStay;
  $("discountPerNight").value = ls && n >= ls.minNights ? String(ls.perNight) : "0";
}


/* ═══════════════════════════════════════════════════════════════════════
   4. RENDER UI
═══════════════════════════════════════════════════════════════════════ */
function renderRooms() {
  const host = $("rooms");
  host.innerHTML = "";
  ROOMS.forEach(r => {
    const lbl = document.createElement("label");
    lbl.className = "pill";
    const minP = Math.min(...Object.values(r.prices));
    const maxP = Math.max(...Object.values(r.prices));
    lbl.innerHTML = `
      <input type="checkbox" name="roomCheck" value="${r.id}" />
      <div>
        <div><strong>Camera ${r.id}</strong> <!-- <span class="tag">${r.type}</span> --></div>
        <!-- <div class="muted" style="font-size:12px;">${formatEuro(minP)}–${formatEuro(maxP)}/notte</div> -->
      </div>`;
    lbl.querySelector("input").addEventListener("change", onRoomOrModeChange);
    host.appendChild(lbl);
  });
}

function renderMultiGuestSelectors(rooms) {
  const grid = $("multiGuestsGrid");
  grid.innerHTML = "";
  if (!rooms.length) {
    grid.innerHTML = `<div class="muted">Seleziona prima le camere.</div>`;
    return;
  }
  rooms.forEach(rid => {
    const room = ROOMS.find(r => r.id === rid);
    const maxG = Math.max(...Object.keys(room.prices).map(Number));
    const item = document.createElement("div");
    item.className = "multi-guest-item";
    let opts = "";
    for (let g = 1; g <= maxG; g++) {
      opts += `<option value="${g}">${g} ${g>1?"ospiti":"ospite"}</option>`;
    }
    item.innerHTML = `
      <label>Camera ${rid} <!-- <span class="tag" style="font-size:11px;">${room.type}</span> --></label>
      <select id="mgRoom_${rid}">${opts}</select>`;
    item.querySelector("select").addEventListener("change", buildOutputs);
    grid.appendChild(item);
  });
}

function syncModeUI() {
  const multi = isMultiMode();
  $("singleGuestRow").style.display  = multi ? "none" : "";
  $("datesRow").classList.toggle("no-guests", multi);
  $("multiGuestSection").style.display = multi ? "" : "none";
  $("singleNameCol").style.display   = multi ? "none" : "";
  $("multiNameCol").style.display    = multi ? "" : "none";
  if (multi) {
    renderMultiGuestSelectors(getSelectedRooms());
  }
}

function onRoomOrModeChange() {
  // Camera scelta: togli il promemoria "👉 seleziona…" lasciato dalla richiesta
  const st = $("pasteStatus");
  if (st.dataset.todo && getSelectedRooms().length) {
    st.textContent = st.textContent.replace(st.dataset.todo, "").replace(/\s*·\s*$/, "");
    delete st.dataset.todo;
  }
  syncModeUI();
  buildOutputs();
}

function syncCustomDiscountUI() {
  const t = $("extraDiscountType").value;
  const inp = $("customDiscountPerNight");
  inp.disabled = t !== "custom";
  if (t !== "custom") inp.value = "0";
}


/* ═══════════════════════════════════════════════════════════════════════
   5. DISCOUNT LOGIC
═══════════════════════════════════════════════════════════════════════ */
function computeDiscounts(discountPerNight, extraDiscountType, customDiscountPerNight) {
  const BUNDLE = 10;
  const extra =
    extraDiscountType === "custom" ? Math.max(0, customDiscountPerNight) :
    extraDiscountType === "bundle" ? BUNDLE : 0;
  const longStay = Math.max(0, discountPerNight);
  const total = longStay + extra;

  const linesIT = [], linesEN = [];
  if (longStay > 0) {
    linesIT.push(`Sconto soggiorno lungo: ${formatEuro(longStay)} a notte`);
    linesEN.push(`Long-stay discount: ${formatEuro(longStay)} per night`);
  }
  if (extra > 0) {
    const lblIT = extraDiscountType === "bundle" ? "Sconto prenotazione congiunta" : "Sconto personalizzato";
    const lblEN = extraDiscountType === "bundle" ? "Joint booking discount" : "Custom discount";
    linesIT.push(`${lblIT}: ${formatEuro(extra)} a notte`);
    linesEN.push(`${lblEN}: ${formatEuro(extra)} per night`);
  }
  return {
    totalDiscountPerNight: total,
    discountLineIT: linesIT.join("\n"),
    discountLineEN: linesEN.join("\n"),
  };
}


/* ═══════════════════════════════════════════════════════════════════════
   6. MESSAGE BUILDERS
═══════════════════════════════════════════════════════════════════════ */

// ── 6a. Standard (single guest count across all rooms) ────────────────
function buildStandardMessages({ rooms, guests, nights, checkin, checkout, d, emoji, extra, signature }) {
  const roomData = rooms.map(rid => {
    const q = roomQuote(rid, guests, checkin, checkout);
    const disc = q.error ? 0 : d.totalDiscountPerNight * nights + q.promos.reduce((s, p) => s + p.amount, 0);
    return { rid, ...q, missing: !!q.error, disc, total: q.error ? null : q.full - disc };
  });
  const missing  = roomData.some(r => r.missing);
  const contact  = roomData.some(r => r.error === "contact");
  const ci  = formatDateIT(checkin), co = formatDateIT(checkout);
  const ciE = formatDateEN(checkin), coE = formatDateEN(checkout);
  const roomsStr = rooms.slice().sort((a,b)=>a-b).join(", ");
  const labelsIT = roomData.map(r => r.missing ? "" : nightlyLabel(r.nightly, "it"));
  const labelsEN = roomData.map(r => r.missing ? "" : nightlyLabel(r.nightly, "en"));
  const prices   = labelsIT; // per il confronto "tutte uguali"

  // Price lines
  const priceLineIT = missing
    ? (contact ? "Tariffa: da definire per queste date." : "Tariffa: da verificare per questo numero di ospiti.")
    : allSame(labelsIT)
      ? `Prezzo: ${labelsIT[0]}`
      : `Prezzo per notte:\n${roomData.map((r,i)=>`• Camera ${r.rid}: ${labelsIT[i]}`).join("\n")}`;

  const priceLineEN = missing
    ? (contact ? "Rate: to be defined for these dates." : "Rate: to be confirmed for this number of guests.")
    : allSame(labelsEN)
      ? `Rate: ${labelsEN[0]}`
      : `Nightly rate:\n${roomData.map((r,i)=>`• Room ${r.rid}: ${labelsEN[i]}`).join("\n")}`;

  const promoIT = missing ? [] : promoLines(roomData, "it");
  const promoEN = missing ? [] : promoLines(roomData, "en");

  // Total lines
  function totalLine(lang) {
    if (missing) return "";
    const isIT   = lang === "it";
    const roomLbl = isIT ? "Camera" : "Room";
    const sameAll = allSame(roomData.map(r => r.full)) && allSame(roomData.map(r => r.disc));

    if (sameAll) {
      const full  = roomData[0].full;
      const total = roomData[0].total;
      return roomData[0].disc > 0
        ? (isIT ? `Totale ${formatEuro(total)} invece di ${formatEuro(full)}` : `Total: ${formatEuro(total)} instead of ${formatEuro(full)}`)
        : (isIT ? `Totale ${formatEuro(full)}` : `Total: ${formatEuro(full)}`);
    }
    const ls = roomData.map(r => r.disc > 0
        ? `• ${roomLbl} ${r.rid}: ${formatEuro(r.total)} (${isIT ? "invece di" : "instead of"} ${formatEuro(r.full)})`
        : `• ${roomLbl} ${r.rid}: ${formatEuro(r.full)}`);
    return (isIT ? `Totale (${nights} ${pluralIT(nights)}):\n` : `Total (${nights} ${pluralEN(nights)}):\n`) + ls.join("\n");
  }

  const siteIT = "Puoi visitare www.gardahavens.com per consultare foto, listino prezzi e informazioni su biglietti convenzionati per le attrazioni locali.";
  const siteEN = "You can visit www.gardahavens.com to view photos, price list, and information about discounted tickets for local attractions.";

  const guestLabelIT = guests === 1 ? "1 ospite" : `${guests} ospiti`;
  const guestLabelEN = guests === 1 ? "1 guest" : `${guests} guests`;
  const roomLabelIT  = rooms.length === 1 ? `Camera n. ${roomsStr}` : `Camere n. ${roomsStr}`;
  const roomLabelEN  = rooms.length === 1 ? `Room no. ${roomsStr}` : `Rooms no. ${roomsStr}`;

  const formalIT = lines([
    greeting("it"),
    `confermiamo la disponibilità ${roomLabelIT} per ${guestLabelIT} nel periodo ${ci}–${co} (${nights} ${pluralIT(nights)})${emoji ? " "+emoji : ""}.`,
    priceLineIT,
    d.discountLineIT || null,
    ...promoIT,
    totalLine("it") || null,
    "(esclusa tassa di soggiorno e bollo)",
    "Cancellazione gratuita, pagamento al check-in.",
    extra ? `Informazioni aggiuntive: ${extra}` : null,
    siteIT,
    signature
  ]);

  const formalEN = lines([
    greeting("en"),
    `we confirm the availability of ${roomLabelEN} for ${guestLabelEN} from ${ciE} to ${coE} (${nights} ${pluralEN(nights)})${emoji ? " "+emoji : ""}.`,
    priceLineEN,
    d.discountLineEN || null,
    ...promoEN,
    totalLine("en") || null,
    "(city tax and stamp duty not included)",
    "Free cancellation, payment at check-in.",
    extra ? `Additional information: ${extra}` : null,
    siteEN,
    signature
  ]);

  const shortIT = [
    `Prenotazione confermata ✅ Camera ${roomsStr} per ${guestLabelIT}: ${ci}–${co} (${nights} ${pluralIT(nights)}).`,
    `Totale: vedi dettaglio offerta. Info: www.gardahavens.com${emoji ? " "+emoji : ""}`,
    signature
  ].join("\n");

  const shortEN = [
    `Booking confirmed ✅ Room ${roomsStr} for ${guestLabelEN}: ${ciE}–${coE} (${nights} ${pluralEN(nights)}).`,
    `Total: see offer details. Info: www.gardahavens.com${emoji ? " "+emoji : ""}`,
    signature
  ].join("\n");

  const priceHint = contact
    ? "⚠️ Date oltre il listino (dal " + (Number(GHPrices.data.validUntil.slice(0,4)) + 1) + "): prezzo da definire a mano."
    : missing
    ? "⚠️ Alcune camere non hanno prezzo per quel numero di ospiti (controlla)."
    : allSame(prices)
      ? `Prezzo per ${guests} ospiti: ${labelsIT[0]}`
      : "Prezzi diversi tra camere selezionate";

  const calDesc = {};
  roomData.forEach(r => { calDesc[r.rid] = calendarDescription(r, { guests, nights, checkin, checkout,
    manualPerNight: d.totalDiscountPerNight, manualLines: d.discountLineIT ? d.discountLineIT.split("\n") : [] }); });

  return { messages: [
    { title:"Offerta (IT)",        text:formalIT, lang:"it" },
    { title:"Offer (EN)",          text:formalEN, lang:"en" },
    { title:"Conferma (IT)",       text:shortIT,  lang:"it",  gcal:{ rooms, checkin, checkout, desc: calDesc } },
    { title:"Confirmation (EN)",   text:shortEN,  lang:"en",  gcal:{ rooms, checkin, checkout, desc: calDesc } },
  ], priceHint };
}

// ── 6b. Multi-room group (different guest count per room) ─────────────
function buildMultiMessages({ rooms, roomGuests, nights, checkin, checkout, d, emoji, extra, signature }) {
  const ci  = formatDateIT(checkin), co = formatDateIT(checkout);
  const ciE = formatDateEN(checkin), coE = formatDateEN(checkout);
  const roomsStr = rooms.slice().sort((a,b)=>a-b).join(", ");

  // Per-room data
  const roomData = rooms.map((rid, i) => {
    const g = roomGuests[i];
    const q = roomQuote(rid, g, checkin, checkout);
    const promo = q.error ? 0 : q.promos.reduce((s, p) => s + p.amount, 0);
    return { rid, g, ...q, missing: !!q.error, promo };
  });

  const anyMissing = roomData.some(r => r.missing);
  const contact = roomData.some(r => r.error === "contact");
  const totalGuests = roomGuests.reduce((s, g) => s + g, 0);
  const discPerRoom = d.totalDiscountPerNight; // applied per room per night

  // Build per-room lines
  function roomLines(lang) {
    return roomData.map(({ rid, g, nightly, full, promo, missing, error }) => {
      const disc  = missing ? 0 : discPerRoom * nights + promo;
      const total = missing ? null : full - disc;
      const gLabel = lang === "it"
        ? (g === 1 ? "1 ospite" : `${g} ospiti`)
        : (g === 1 ? "1 guest" : `${g} guests`);
      const it = lang === "it";
      const lbl = missing ? "" : nightlyLabel(nightly, lang);
      const priceStr = missing
        ? (error === "contact" ? (it ? "tariffa da definire" : "rate to be defined") : (it ? "tariffa da verificare" : "rate to be confirmed"))
        : disc > 0
          ? `${lbl} → ${formatEuro(total)} (${it ? "invece di" : "instead of"} ${formatEuro(full)})`
          : `${lbl} → tot. ${formatEuro(full)}`;
      return lang === "it"
        ? `• Camera ${rid} (${gLabel}): ${priceStr}`
        : `• Room ${rid} (${gLabel}): ${priceStr}`;
    });
  }

  // Grand total
  function grandTotal() {
    if (anyMissing) return null;
    let fullSum = 0, discSum = 0;
    roomData.forEach(({ full, promo }) => {
      fullSum += full;
      discSum += discPerRoom * nights + promo;
    });
    return { full: fullSum, total: fullSum - discSum, hasDisc: discSum > 0 };
  }

  const gt = grandTotal();

  const siteIT = "Puoi visitare www.gardahavens.com per consultare foto, listino prezzi e informazioni su biglietti convenzionati per le attrazioni locali.";
  const siteEN = "You can visit www.gardahavens.com to view photos, price list, and information about discounted tickets for local attractions.";

  const totalLineIT = gt
    ? gt.hasDisc
      ? `Totale complessivo: ${formatEuro(gt.total)} invece di ${formatEuro(gt.full)}`
      : `Totale complessivo: ${formatEuro(gt.full)}`
    : null;

  const totalLineEN = gt
    ? gt.hasDisc
      ? `Grand total: ${formatEuro(gt.total)} instead of ${formatEuro(gt.full)}`
      : `Grand total: ${formatEuro(gt.full)}`
    : null;

  const formalIT = lines([
    greeting("it"),
    `confermiamo la disponibilità delle Camere n. ${roomsStr} per il vostro gruppo (${totalGuests} ospiti in totale) nel periodo ${ci}–${co} (${nights} ${pluralIT(nights)})${emoji ? " "+emoji : ""}.`,
    "Dettaglio per camera:", ...roomLines("it"),
    d.discountLineIT || null,
    ...(anyMissing ? [] : promoLines(roomData, "it")),
    totalLineIT || null,
    "(esclusa tassa di soggiorno e bollo)",
    "Cancellazione gratuita, pagamento al check-in.",
    extra ? `Informazioni aggiuntive: ${extra}` : null,
    siteIT,
    signature
  ]);

  const formalEN = lines([
    greeting("en"),
    `we confirm the availability of Rooms no. ${roomsStr} for your group (${totalGuests} guests in total) from ${ciE} to ${coE} (${nights} ${pluralEN(nights)})${emoji ? " "+emoji : ""}.`,
    "Room breakdown:", ...roomLines("en"),
    d.discountLineEN || null,
    ...(anyMissing ? [] : promoLines(roomData, "en")),
    totalLineEN || null,
    "(city tax and stamp duty not included)",
    "Free cancellation, payment at check-in.",
    extra ? `Additional information: ${extra}` : null,
    siteEN,
    signature
  ]);

  const shortIT = [
    `Prenotazione confermata ✅ Camere ${roomsStr} – gruppo ${totalGuests} ospiti: ${ci}–${co} (${nights} ${pluralIT(nights)}).`,
    gt ? `Totale complessivo: ${formatEuro(gt.total ?? gt.full)}. Info: www.gardahavens.com${emoji ? " "+emoji : ""}` : `Totale: vedi offerta. Info: www.gardahavens.com${emoji ? " "+emoji : ""}`,
    signature
  ].join("\n");

  const shortEN = [
    `Booking confirmed ✅ Rooms ${roomsStr} – group ${totalGuests} guests: ${ciE}–${coE} (${nights} ${pluralEN(nights)}).`,
    gt ? `Grand total: ${formatEuro(gt.total ?? gt.full)}. Info: www.gardahavens.com${emoji ? " "+emoji : ""}` : `Total: see offer. Info: www.gardahavens.com${emoji ? " "+emoji : ""}`,
    signature
  ].join("\n");

  const priceHint = contact
    ? "⚠️ Date oltre il listino (dal " + (Number(GHPrices.data.validUntil.slice(0,4)) + 1) + "): prezzo da definire a mano."
    : anyMissing
    ? "⚠️ Alcune camere non hanno prezzo per il numero di ospiti selezionato."
    : `Gruppo: ${totalGuests} ospiti totali in ${rooms.length} camere`;

  const calDesc = {};
  roomData.forEach(r => { calDesc[r.rid] = calendarDescription(r, { guests: r.g, nights, checkin, checkout,
    manualPerNight: discPerRoom, manualLines: d.discountLineIT ? d.discountLineIT.split("\n") : [] }); });

  return { messages: [
    { title:"Offerta Gruppo (IT)",       text:formalIT, lang:"it" },
    { title:"Group Offer (EN)",          text:formalEN, lang:"en" },
    { title:"Conferma Gruppo (IT)",      text:shortIT,  lang:"it",  gcal:{ rooms, checkin, checkout, desc: calDesc } },
    { title:"Group Confirmation (EN)",   text:shortEN,  lang:"en",  gcal:{ rooms, checkin, checkout, desc: calDesc } },
  ], priceHint };
}

/** Filter null/undefined/empty-string, join with newline */
function lines(arr) {
  return arr.filter(l => l !== null && l !== undefined && l !== "").join("\n");
}

function buildOutputs() {
  const rooms   = getSelectedRooms();
  const checkin = $("checkin").value;
  const checkout= $("checkout").value;
  const nights  = nightsBetween(checkin, checkout);
  const emoji   = $("emoji").value.trim();
  const signature = $("signature").value.trim() || "Garda Havens";
  const extra   = $("extra").value.trim();
  const lang    = $("langToggle").value;
  const discountPerNight       = Number($("discountPerNight").value || 0);
  const extraDiscountType      = $("extraDiscountType").value;
  const customDiscountPerNight = Number($("customDiscountPerNight").value || 0);

  // Validation
  if (!rooms.length) {
    $("summary").innerHTML = `<span class="warn">Seleziona almeno una camera.</span>`;
    $("outputs").innerHTML = "";
    $("priceHint").textContent = "";
    return;
  }
  if (!checkin || !checkout || nights <= 0) {
    $("summary").innerHTML = `<span class="warn">Inserisci date valide (check-out dopo check-in).</span>`;
    $("outputs").innerHTML = "";
    $("priceHint").textContent = "";
    return;
  }

  const d = computeDiscounts(discountPerNight, extraDiscountType, customDiscountPerNight);
  const roomGuests = getRoomGuests(rooms);
  const totalGuests = roomGuests.reduce((s,g)=>s+g,0);
  const multi = isMultiMode();

  const roomsStr = rooms.slice().sort((a,b)=>a-b).join(", ");
  $("summary").innerHTML = multi
    ? `<span class="ok">OK</span> · Camere: ${roomsStr} · ${roomGuests.join("+")} ospiti · ${nights} ${pluralIT(nights)}`
    : `<span class="ok">OK</span> · Camere: ${roomsStr} · ${roomGuests[0]} ospiti · ${nights} ${pluralIT(nights)}`;

  const params = { rooms, nights, checkin, checkout, d, emoji, extra, signature };
  const result = multi
    ? buildMultiMessages({ ...params, roomGuests })
    : buildStandardMessages({ ...params, guests: roomGuests[0] });

  $("priceHint").textContent = result.priceHint;

  const outputs = lang === "both"
    ? result.messages
    : result.messages.filter(o => o.lang === lang);

  renderOutputs(outputs);
}

function encodeWaText(str) {
  // Use same encoding as api.whatsapp.com/send: encodeURIComponent then spaces as +
  return encodeURIComponent(str).replace(/%20/g, '+');
}

function getWaNumber() {
  const sel = $("phonePrefix").value;
  const prefix = sel === "custom"
    ? $("phonePrefixCustom").value.trim().replace(/\D/g, "")
    : sel.trim();
  const num = $("phoneNumber").value.trim().replace(/\D/g, "");
  return num ? prefix + num : "";
}

$("phonePrefix").addEventListener("change", function() {
  const custom = $("phonePrefixCustom");
  if (this.value === "custom") {
    custom.style.display = "block";

/* ═══════════════════════════════════════════════════════════════════════
   INCOLLA RICHIESTA (riga "GH|lang=..|in=..|out=..|rooms=..|adults=..|kids=..|name=..|surname=..|tel=..")
═══════════════════════════════════════════════════════════════════════ */
function parseRequest(text) {
  // Dalla riga "GH|" fino alla prima riga vuota: le email possono andare a capo dentro la riga
  const m = text.replace(/\r/g, "").match(/GH\|[\s\S]*?(?=\n\s*\n|$)/);
  if (!m) return null;
  const data = {};
  m[0].replace(/\s*\n\s*/g, "").split("|").slice(1).forEach(part => {
    const i = part.indexOf("=");
    if (i > 0) data[part.slice(0, i).trim()] = part.slice(i + 1).trim();
  });
  return data;
}

/** Numero dalla richiesta → prefisso "Altro" vuoto + numero completo. Ritorna un avviso o "". */
function fillPhone(raw) {
  const intl = /^\s*(\+|00)/.test(raw);
  const digits = raw.replace(/\D/g, "").replace(/^00/, "");
  $("phonePrefix").value = "custom";
  $("phonePrefixCustom").style.display = "block";
  $("phonePrefixCustom").value = "";
  $("phoneNumber").value = digits;
  if (!digits) return "telefono mancante";
  return intl ? "" : "prefisso non indicato: controlla il numero";
}

function fillFromRequest() {
  const status = $("pasteStatus");
  const d = parseRequest($("pasteRequest").value);
  if (!d) { status.textContent = "⚠️ Riga GH|... non trovata"; return; }
  const warnings = [];

  // Camere: il sito chiede solo quante ne servono, quali le scegli tu
  const nRooms = Number(d.rooms) || 1;
  document.querySelectorAll('input[name="roomCheck"]').forEach(c => c.checked = false);
  $("multiBooking").checked = nRooms > 1;
  syncModeUI();
  const todo = `👉 seleziona ${nRooms === 1 ? "la camera" : nRooms + " camere"}`;

  // Ospiti = adulti + bambini
  const total = (Number(d.adults) || 0) + (Number(d.kids) || 0);
  const maxOpt = Math.max(...[...$("guests").options].map(o => Number(o.value)));
  $("guests").value = String(Math.min(Math.max(total, 1), maxOpt));
  if (nRooms === 1 && total > maxOpt) warnings.push(`${total} ospiti: impostato ${maxOpt}`);
  if (nRooms > 1) warnings.push(`${total} ospiti da dividere tra le camere`);

  // Date
  if (/^\d{4}-\d{2}-\d{2}$/.test(d.in || ""))  $("checkin").value  = d.in;  else warnings.push("check-in mancante");
  if (/^\d{4}-\d{2}-\d{2}$/.test(d.out || "")) $("checkout").value = d.out; else warnings.push("check-out mancante");
  autoSetDiscount();

  // Nome, lingua, telefono
  $("guestName").value = d.name || "";
  if (d.lang === "it" || d.lang === "en") $("langToggle").value = d.lang;
  const phoneWarn = fillPhone(d.tel || "");
  if (phoneWarn) warnings.push(phoneWarn);

  buildOutputs();
  renderSnippets();
  status.textContent = (warnings.length ? "⚠️ " + warnings.join(" · ") + " · " : "") + todo;
  status.dataset.todo = todo;
  renderRequestCard({ firstName: d.name, lastName: d.surname, tel: d.tel, sent: d.sent });
  $("pasteBox").open = false;
}

/** Scheda con i contatti dell'ospite. info: { firstName, lastName, tel, email, notes, ref } o null per nasconderla. */
function renderRequestCard(info) {
  const box = $("requestCard");
  box.innerHTML = "";
  currentRequest = info || null;   // usato anche nella descrizione dell'evento calendario
  if (!info) { box.style.display = "none"; return; }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
  const name = [info.firstName, info.lastName].filter(Boolean).join(" ") || "Ospite";
  box.appendChild(el("div", "rc-name", name + (info.ref ? `  ·  ${info.ref}` : "")));
  const tel = String(info.tel || "");
  const digits = tel.replace(/\D/g, "");
  const intl = tel.trim().startsWith("+");
  const notes = String(info.notes || "").trim();
  if (notes && !/^(null|undefined)$/i.test(notes)) box.appendChild(el("div", "rc-notes", "📝 " + notes));
  // Contatti in chiaro (selezionabili), poi tre pulsanti uguali
  const contacts = [digits ? (intl ? "+" : "") + digits : "", info.email || ""].filter(Boolean).join("  ·  ");
  if (contacts) box.appendChild(el("div", "rc-contacts", contacts));
  const actions = el("div", "rc-actions");
  const link = (href, text, cls) => { const a = el("a", cls, text); a.href = href; if (href.startsWith("http")) a.target = "_blank"; actions.appendChild(a); };
  if (digits) {
    link("https://wa.me/" + digits, "💬 WhatsApp", "rc-wa");
    link("tel:" + (intl ? "+" : "") + digits, "📞 Chiama");
  }
  if (info.email) link("mailto:" + info.email, "✉️ Email");
  if (actions.children.length) box.appendChild(actions);
  box.style.display = "";
}

/* Richiesta salvata nel foglio: link generator.html#r=<codice> → scarica i dati dallo script */
const REQUESTS_URL = "https://script.google.com/macros/s/AKfycbzRomEGmh-v-hcGkZ_S_XITYxa3Mjtdv4AVy56KRqLxd_I5bKGznEO6urS4N2dm8Qixlg/exec";

async function loadRequest(id, retry) {
  if (localStorage.getItem("ghAccess") !== "granted") return; // dopo il login riparte da checkAccess()
  let key = localStorage.getItem("ghKey");
  if (!key) {
    key = (prompt("Inserisci il codice d'accesso per aprire la richiesta") || "").trim();
    if (!key) return;
    localStorage.setItem("ghKey", key);
  }
  const status = $("pasteStatus");
  status.textContent = "⏳ Carico la richiesta…";
  try {
    const res = await fetch(`${REQUESTS_URL}?r=${encodeURIComponent(id)}&k=${encodeURIComponent(key)}`);
    const json = await res.json();
    if (json.ok) {
      const r = json.request;
      $("pasteRequest").value = r.gh;
      fillFromRequest();
      renderRequestCard({ firstName: r.firstName, lastName: r.lastName, email: r.email, notes: r.notes, ref: r.ref,
        tel: (r.phoneIntl ? "+" : "") + r.phoneDigits, sent: r.sent });
      return;
    }
    if (json.error === "auth" && !retry) { localStorage.removeItem("ghKey"); return loadRequest(id, true); }
    const msg = { auth: "codice d'accesso errato", locked: "troppi tentativi, riprova tra un'ora",
      not_found: "richiesta non trovata", not_configured: "script non configurato (SHEET_ID / GENERATOR_KEY)" };
    status.textContent = "⚠️ " + (msg[json.error] || "errore del server");
  } catch (err) {
    console.error(err);
    status.textContent = "⚠️ Errore di connessione";
  }
}
$("fillFromRequest").addEventListener("click", fillFromRequest);

renderRooms();
setDefaultDates();
autoSetDiscount();
syncCustomDiscountUI();
buildOutputs();
renderSnippets();

// Le parti apribili (Incolla richiesta, Altro, Messaggi rapidi) si chiudono toccando fuori
document.addEventListener("click", e => {
  document.querySelectorAll("details[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; });
});

// Link dall'email: generator.html#GH|lang=..|... → compila in automatico
function fillFromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^r=([0-9a-f]{32})$/);
  if (m) { loadRequest(m[1]); return; }
  if (!h.startsWith("GH|")) return;
  $("pasteRequest").value = h;
  fillFromRequest();
}
fillFromHash();
window.addEventListener("hashchange", fillFromHash);
